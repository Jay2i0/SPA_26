<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style type="text/css">
			:root {
				--green: #6aaa64;
				--yellow: #c9b458;
				--grey: #787c7e7e;
				--black: #121213;
				--border: #3a3a3c;
			}
			body {
				background-color: var(--black);
				color: white;
				font-family: Arial, sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			/* Grid Styles */
			#game-board {
				display: grid;
				grid-template-rows: repeat(6, 1fr);
				gap: 5px;
				margin-bottom: 20px;
			}
			.row {
				display: grid;
				grid-template-columns: repeat(5, 1fr);
				gap: 5px;
			}
			.tile {
				width: 50px;
				height: 50px;
				border: 2px solid var(--border);
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 2rem;
				font-weight: bold;
				text-transform: uppercase;
			}

			/* Keyboard Styles */
			#keyboard {
				display: flex;
				flex-direction: column;
				gap: 5px;
				align-items: center;
				width: 100%;
				max-width: 500px;
			}
			.kbd-row {
				display: flex;
				gap: 6px;
			}
			.key {
				padding: 15px;
				border-radius: 4px;
				background: #818384;
				cursor: pointer;
				font-weight: bold;
				min-width: 30px;
				text-align: center;
			}

			/* Status Colors */
			.correct {
				background-color: var(--green) !important;
				border-color: var(--green);
			}
			.present {
				background-color: var(--yellow) !important;
				border-color: var(--yellow);
			}
			.absent {
				background-color: var(--grey) !important;
				border-color: var(--grey);
			}

			/* Controls & Extra UI */
			#game-controls {
				margin-top: 15px;
				display: none; /* Hidden until game over */
			}
			#restart-btn {
				padding: 10px 20px;
				font-size: 1.2rem;
				background-color: var(--green);
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-weight: bold;
			}
			#restart-btn:hover {
				background-color: #578a51;
			}

			input {
				opacity: 0;
				position: absolute;
				pointer-events: none;
			}
			@media (max-width: 700px) {
				.tile {
					width: 40px;
					height: 40px;
					font-size: 1.5rem;
				}
				.key {
					padding: 10px 5px;
					font-size: 0.8rem;
				}
			}

			/* Animations */
			@keyframes win-bounce {
				0%,
				20% {
					transform: translateY(0);
				}
				40% {
					transform: translateY(-30px);
				}
				50% {
					transform: translateY(5px);
				}
				60% {
					transform: translateY(-15px);
				}
				80% {
					transform: translateY(2px);
				}
				100% {
					transform: translateY(0);
				}
			}
			.win-animation {
				animation: win-bounce 1s ease;
			}

			@keyframes shake {
				10%,
				90% {
					transform: translateX(-2px);
				}
				20%,
				80% {
					transform: translateX(2px);
				}
				30%,
				50%,
				70% {
					transform: translateX(-5px);
				}
				40%,
				60% {
					transform: translateX(5px);
				}
			}
			.shake-animation {
				animation: shake 0.6s ease;
			}

			/* Stats Board */
			#stats-board {
				display: none;
				background-color: var(--border);
				padding: 15px 25px;
				border-radius: 8px;
				margin-top: 15px;
				text-align: center;
				max-width: 400px;
				width: 100%;
			}
			.stats-row {
				display: flex;
				justify-content: space-around;
				margin-bottom: 15px;
			}
			.stat-box {
				display: flex;
				flex-direction: column;
				align-items: center;
			}
			.stat-num {
				font-size: 2rem;
				font-weight: bold;
			}
			.stat-lbl {
				font-size: 0.8rem;
				color: var(--grey);
			}
			.guess-distribution {
				text-align: left;
				font-size: 0.9rem;
			}
			.dist-row {
				display: flex;
				align-items: center;
				margin-bottom: 4px;
			}
			.dist-bar {
				background-color: var(--grey);
				color: white;
				padding: 2px 5px;
				text-align: right;
				margin-left: 5px;
				min-width: 10px;
			}
			.dist-row.current .dist-bar {
				background-color: var(--green);
			}
			header h1 {
      			font-family: 'Bebas Neue', sans-serif;
      			font-size: 2.6rem;
      			letter-spacing: 6px;
      			color: var(--text);
				text-align: center;
    }
		</style>

		<script
			crossorigin
			src="https://unpkg.com/react@18/umd/react.development.js"
		></script>
		<script
			crossorigin
			src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
		></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	</head>
	<body>
		<div id="myapp">
			<!– place to put the React element(s) -->
		</div>

		<script type="text/babel">
			const targetWord = "MOODY";
			const guesses = ["MIGHT", "FLOOD", "STRAY"];
			const maxAttempts = 6;
			const keyboardLayout = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];

			/**
			 * Logic to calculate the status of each letter in a guess
			 */
			function getGuessStatuses(guess, target) {
				const result = new Array(5).fill("absent");
				const targetArr = target.split("");
				const guessArr = guess.split("");

				// Pass 1: Find Correct (Green)
				guessArr.forEach((letter, i) => {
					if (letter === targetArr[i]) {
						result[i] = "correct";
						targetArr[i] = null;
					}
				});

				// Pass 2: Find Present (Yellow)
				guessArr.forEach((letter, i) => {
					if (result[i] !== "correct" && targetArr.includes(letter)) {
						result[i] = "present";
						targetArr[targetArr.indexOf(letter)] = null;
					}
				});

				return result;
			}

			// Global object to track the highest status for the Used Letter Board
			const usedLetterStatus = {};

			// 1. Build the Wordle Board
			const boardRows = [];
			for (let i = 0; i < maxAttempts; i++) {
				const tiles = [];
				const currentGuess = guesses[i] || "";
				const statuses = currentGuess
					? getGuessStatuses(currentGuess, targetWord)
					: [];

				for (let j = 0; j < 5; j++) {
					const letter = currentGuess[j] || "";
					const statusClass = statuses[j] || "";

					// Update Used Letter Status tracking
					if (letter) {
						if (
							statusClass === "correct" ||
							!usedLetterStatus[letter]
						) {
							usedLetterStatus[letter] = statusClass;
						}
					}

					tiles.push(
						<div
							className={`tile ${statusClass}`}
							key={`tile-${i}-${j}`}
						>
							{letter}
						</div>,
					);
				}
				boardRows.push(
					<div className="row" key={`row-${i}`}>
						{tiles}
					</div>,
				);
			}

			// 2. Build the Used Letter Board
			const keyboardRows = keyboardLayout.map((rowStr, rowIndex) => {
				const keys = rowStr.split("").map((char) => {
					const status = usedLetterStatus[char] || "";
					return (
						<div className={`key ${status}`} key={char}>
							{char}
						</div>
					);
				});
				return (
					<div className="kbd-row" key={`kbd-row-${rowIndex}`}>
						{keys}
					</div>
				);
			});

			// 3. Assemble and Render the Game Container
			const gameContainer = (
				<div id="game-container">
					<h1 key="title">Wordle Redux 2</h1>
					<div id="game-board" key="board">
						{boardRows}
					</div>
					<div id="keyboard" key="keyboard">
						{keyboardRows}
					</div>
				</div>
			);

			const myroot = ReactDOM.createRoot(
				document.querySelector("#myapp"),
			);
			myroot.render(gameContainer);
		</script>
	</body>
</html>
